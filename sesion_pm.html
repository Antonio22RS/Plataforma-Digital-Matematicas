  <script>
    /* ============================================================
       Inicialización del carrusel (Swiper)
       ------------------------------------------------------------
       Observación:
       - Se inicializa un Swiper en la clase '.focus-carousel' tal como en el original.
       - Si en esta página no existe un elemento con la clase '.focus-carousel', la inicialización
         no lanza errores, simplemente no muestra carrusel (comportamiento esperado).
       - Si quieres que actúe en otra sección, añade class="focus-carousel" al contenedor adecuado.
       ============================================================ */

    const focusSwiper = new Swiper('.focus-carousel', {
      centeredSlides: true,
      slidesPerView: 'auto',
      loop: true,
      spaceBetween: 40,
      autoplay: { delay: 3500, disableOnInteraction: false },
      pagination: { el: '.swiper-pagination', clickable: true },
      navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
      breakpoints: {
        0: { slidesPerView: 1.2, spaceBetween: 20 },
        768: { slidesPerView: 2.2, spaceBetween: 30 },
        1024: { slidesPerView: 3, spaceBetween: 40 },
      },
    });

    /* ============================================================
       Observador para animar el footer (fade-in)
       ------------------------------------------------------------
       - Añade la clase .visible cuando el footer entra en el viewport.
       - Se deja la misma lógica que en el original.
       ============================================================ */
    (function () {
      const footer = document.getElementById('footer');
      if (!footer) return;

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            footer.classList.add('visible');
            observer.unobserve(footer);
          }
        });
      }, { threshold: 0.2 });

      observer.observe(footer);
    })();
  </script>
